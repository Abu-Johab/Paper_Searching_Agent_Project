[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hsi-research-agent"
version = "2.0.0"
description = "Autonomous Academic Research Discovery & Literature Intelligence Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "PyMuPDF>=1.23.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0"
]

[project.scripts]
research-agent = "hsi_research_agent.main:main"
hsi-research-agent = "hsi_research_agent.main:main"

[tool.setuptools]
packages = [
    "hsi_research_agent",
    "hsi_research_agent.agents",
    "hsi_research_agent.export",
    "hsi_research_agent.graph",
    "hsi_research_agent.llm",
    "hsi_research_agent.processing",
    "hsi_research_agent.search",
    "hsi_research_agent.storage"
]
